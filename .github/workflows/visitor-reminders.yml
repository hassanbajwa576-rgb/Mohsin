name: Visitor reminders

# Calls the app every 5 minutes so guards get their arrival reminders even when nobody has OpsTrack open.
# GitHub can run this a few minutes late; cron-job.org every minute is more exact.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        run: curl -fsS --max-time 30 https://opstrack-alphabold.vercel.app/api/cron/visitor-reminders
